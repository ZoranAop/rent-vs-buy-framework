name: Feature request
description: 建议新功能、新变量或新的扩展点
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: 动机
      description: 为什么需要这个功能？解决什么决策盲区？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 希望怎么实现？（新增参数 / 新增指标 / 改计算口径等）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 有没有更简单或更通用的替代做法？
