name: Bug report
description: 报告模型计算或页面渲染的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么异常？（请区分"计算数值异常"还是"页面/交互异常"）
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何重现？含使用的命令、参数、浏览器与操作步骤。
    validations:
      required: true
  - type: input
    id: params
    attributes:
      label: 参数（如适用）
      description: 例如 price=800 down_pct=40 invest_return=8 property_tax=1.5
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你认为正确的结果应该是什么？
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际得到什么？（贴终端输出或截图）
